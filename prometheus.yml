global:
  evaluation_interval: 15s
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cc-metrics-collector
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: cc-metrics-prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  # Codex session-ledger exporter on the host (launchd,
  # scripts/codex_ledger_exporter.py). Authoritative codex token source: the
  # native OTLP lane undercounts (~31 % capture measured 2026-08-20) because
  # codex skips metric emission for aborted turns and gates the exporter on
  # analytics.enabled (openai/codex#26271). OTLP lane stays as cross-check.
  - job_name: codex-ledger
    static_configs:
      - targets:
          - host.docker.internal:9314
