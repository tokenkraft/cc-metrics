global:
  evaluation_interval: 15s
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cc-metrics-collector
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: cc-metrics-prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
